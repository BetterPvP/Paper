name: BetterPvP release

# A tag such as 26.3-bpvp.1 builds the paperclip jar and attaches it to a release of the same name.
on:
  push:
    tags:
      - "*-bpvp.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the paperclip jar
        run: |
          git config --global user.email "ci@betterpvp.net"
          git config --global user.name "BetterPvP CI"
          # Separate runs: building in the same run as applyPatches trips Gradle's task-ordering check.
          ./gradlew applyPatches --console=plain
          ./gradlew createPaperclipJar --console=plain

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          jar=$(ls paper-server/build/libs/paper-paperclip-*.jar | head -1)
          cp "$jar" "paper-$TAG.jar"
          sha256sum "paper-$TAG.jar" > "paper-$TAG.jar.sha256"
          gh release create "$TAG" "paper-$TAG.jar" "paper-$TAG.jar.sha256" --title "$TAG" --notes "Upstream Paper $(grep '^mcVersion=' gradle.properties | cut -d= -f2) with BetterPvP's changes, built from ${GITHUB_SHA::10}."
